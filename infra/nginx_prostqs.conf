server {
    listen 80;
    server_name api.prostqs.com.br;

    # Logs detalhados para diagnóstico
    access_log /var/log/nginx/prostqs-access.log;
    error_log /var/log/nginx/prostqs-error.log debug;

    client_max_body_size 50M;

    # Configuração de CORS no NGINX para segurança adicional e 502s
    set $cors_origin "";
    if ($http_origin ~* "^https?://(prostqs\.com\.br|www\.prostqs\.com\.br|sce\.prostqs\.com\.br|.*\.vercel\.app)$") {
        set $cors_origin $http_origin;
    }

    location / {
        # Preflight
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' "$cors_origin" always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Verification-ID' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Headers de CORS para respostas normais
        add_header 'Access-Control-Allow-Origin' "$cors_origin" always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        # Timeout e Buffers
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Health check sem frescura
    location /health {
        proxy_pass http://127.0.0.1:8080/health;
        access_log off;
    }
}
