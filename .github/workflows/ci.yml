# ========================================
# PROST-QS - CI/CD Pipeline
# ========================================
# 
# FLUXO AUTOMÁTICO:
# 1. Push para main → CI roda → Render deploya backend → Vercel deploya frontend
# 2. Pull Request → CI valida → Preview no Vercel
#
# VOCÊ NÃO PRECISA FAZER NADA MANUAL!
# Só dar: git add . && git commit -m "msg" && git push

name: Prost-QS CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: '1.22'
  NODE_VERSION: '20'

jobs:
  # ========================================
  # BACKEND - Go
  # ========================================
  backend:
    name: 🔧 Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐹 Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: 📦 Download Dependencies
        run: go mod download

      - name: 🔨 Build
        run: CGO_ENABLED=0 go build -ldflags "-s -w" -o prost-qs ./cmd/api/main.go

      - name: ✅ Tests
        env:
          JWT_SECRET: "ci_test_jwt_secret_32bytes_minimum"
          AES_SECRET_KEY: "ci_test_aes_key_32bytes_minimum!"
          SECRETS_MASTER_KEY: "ci_test_master_key_32bytes_min!"
          SQLITE_DB_PATH: ":memory:"
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: 📊 Coverage Report
        if: github.event_name == 'pull_request'
        run: go tool cover -func=coverage.out

  # ========================================
  # FRONTEND - Next.js
  # ========================================
  frontend:
    name: 🎨 Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔍 Type Check
        run: npm run lint || true

      - name: 🔨 Build
        env:
          NEXT_PUBLIC_API_URL: https://uno0826.onrender.com/api/v1
        run: npm run build

  # ========================================
  # DEPLOY STATUS (informativo)
  # ========================================
  deploy-info:
    name: 📋 Deploy Info
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: 🚀 Deploy Status
        run: |
          echo "=========================================="
          echo "✅ CI PASSOU - DEPLOYS AUTOMÁTICOS:"
          echo "=========================================="
          echo ""
          echo "🔧 BACKEND (Render):"
          echo "   → Auto-deploy ativado"
          echo "   → URL: https://uno0826.onrender.com"
          echo "   → Status: https://dashboard.render.com"
          echo ""
          echo "🎨 FRONTEND (Vercel):"
          echo "   → Auto-deploy ativado"  
          echo "   → URL: https://frontend-prost.vercel.app"
          echo "   → Status: https://vercel.com/dashboard"
          echo ""
          echo "=========================================="
          echo "Nenhuma ação manual necessária!"
          echo "=========================================="
