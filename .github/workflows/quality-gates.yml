# ========================================
# PROST-QS - Quality Gates (QA Automatizado)
# ========================================
#
# Este workflow implementa as recomendações do QA Report:
# 1. Cobertura mínima obrigatória
# 2. Testes de segurança
# 3. Lint obrigatório
# 4. Bloqueia merge se failing
#
# Criado em: 19/01/2026

name: Quality Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  GO_VERSION: '1.22'
  MIN_COVERAGE: 25  # Mínimo 25% - aumentar gradualmente para 50%

jobs:
  # ========================================
  # QUALITY GATE 1: Cobertura de Testes
  # ========================================
  coverage-check:
    name: 📊 Coverage Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐹 Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: 📦 Download Dependencies
        run: go mod download

      - name: ✅ Run Tests with Coverage
        env:
          JWT_SECRET: "qa_test_jwt_secret_32bytes_min!!"
          AES_SECRET_KEY: "qa_test_aes_key_32bytes_minimum!"
          SECRETS_MASTER_KEY: "qa_test_master_key_32bytes_min!"
          SQLITE_DB_PATH: ":memory:"
          GIN_MODE: "test"
        run: |
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./... 2>&1 | tee test-output.txt
          
          # Count passing tests
          PASS_COUNT=$(grep -c "^--- PASS" test-output.txt || echo "0")
          FAIL_COUNT=$(grep -c "^--- FAIL" test-output.txt || echo "0")
          
          echo "✅ Tests Passed: $PASS_COUNT"
          echo "❌ Tests Failed: $FAIL_COUNT"
          
          if [ "$FAIL_COUNT" -gt 0 ]; then
            echo "::error::$FAIL_COUNT tests failed"
            exit 1
          fi

      - name: 📊 Check Minimum Coverage
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "📊 Total Coverage: ${COVERAGE}%"
          echo "📊 Minimum Required: ${{ env.MIN_COVERAGE }}%"
          
          # Compare coverage (bash comparison)
          if (( $(echo "$COVERAGE < ${{ env.MIN_COVERAGE }}" | bc -l) )); then
            echo "::error::Coverage ${COVERAGE}% is below minimum ${{ env.MIN_COVERAGE }}%"
            exit 1
          fi
          
          echo "✅ Coverage check passed!"

      - name: 📝 Coverage Summary
        run: |
          echo "## 📊 Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Module | Coverage |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|----------|" >> $GITHUB_STEP_SUMMARY
          go tool cover -func=coverage.out | grep -E "^prost-qs/backend/(internal|pkg)" | head -20 | while read line; do
            MOD=$(echo $line | awk '{print $1}' | sed 's/prost-qs\/backend\///')
            COV=$(echo $line | awk '{print $3}')
            echo "| \`$MOD\` | $COV |" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          TOTAL=$(go tool cover -func=coverage.out | grep total | awk '{print $3}')
          echo "**Total: $TOTAL**" >> $GITHUB_STEP_SUMMARY

  # ========================================
  # QUALITY GATE 2: Invariants Check
  # ========================================
  invariants-check:
    name: 🛡️ Invariants Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐹 Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: 🛡️ Run Invariant Tests
        env:
          JWT_SECRET: "qa_test_jwt_secret_32bytes_min!!"
          AES_SECRET_KEY: "qa_test_aes_key_32bytes_minimum!"
          SECRETS_MASTER_KEY: "qa_test_master_key_32bytes_min!"
          SQLITE_DB_PATH: ":memory:"
          GIN_MODE: "test"
        run: |
          echo "Running invariant tests..."
          go test -v -run "Invariant" ./pkg/invariants/... 2>&1 | tee invariant-output.txt
          
          FAIL_COUNT=$(grep -c "FAIL" invariant-output.txt || echo "0")
          
          if [ "$FAIL_COUNT" -gt 0 ]; then
            echo "::error::Invariant tests failed!"
            exit 1
          fi
          
          echo "✅ All invariants passed!"

  # ========================================
  # QUALITY GATE 3: Security Scan
  # ========================================
  secrets-scan:
    name: 🔒 Secrets Scan
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔒 Scan for Secrets
        run: |
          echo "Scanning for potential secrets in code..."
          
          # Patterns to detect
          PATTERNS=(
            "pq_pk_[a-zA-Z0-9]+"
            "pq_sk_[a-zA-Z0-9]+"
            "sk_live_[a-zA-Z0-9]+"
            "sk_test_[a-zA-Z0-9]+"
            "AKIA[A-Z0-9]{16}"
            "ghp_[a-zA-Z0-9]{36}"
          )
          
          FOUND=0
          for pattern in "${PATTERNS[@]}"; do
            if grep -rEl "$pattern" --include="*.md" --include="*.go" --include="*.ts" --include="*.js" . 2>/dev/null | grep -v node_modules | grep -v ".git"; then
              echo "::warning::Found potential secret pattern: $pattern"
              FOUND=1
            fi
          done
          
          if [ "$FOUND" -eq 1 ]; then
            echo "::warning::Potential secrets found in repository. Please review and rotate if necessary."
          else
            echo "✅ No secrets detected"
          fi

  # ========================================
  # QUALITY GATE 4: Critical Tests
  # ========================================
  critical-tests:
    name: 🎯 Critical Path Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐹 Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: 🎯 Run Critical Flow Tests
        env:
          JWT_SECRET: "qa_test_jwt_secret_32bytes_min!!"
          AES_SECRET_KEY: "qa_test_aes_key_32bytes_minimum!"
          SECRETS_MASTER_KEY: "qa_test_master_key_32bytes_min!"
          SQLITE_DB_PATH: ":memory:"
          GIN_MODE: "test"
        run: |
          echo "Running critical flow tests..."
          
          # Identity Critical Tests
          go test -v -run "TestCriticalFlow" ./internal/identity/... 2>&1 || true
          
          # Security Tests
          go test -v -run "TestSecurity" ./internal/identity/... 2>&1 || true
          
          # WAR OBS Tests
          go test -v ./pkg/warobs/... 2>&1 || true
          
          echo "✅ Critical tests completed"

  # ========================================
  # SUMMARY JOB
  # ========================================
  quality-summary:
    name: 📋 Quality Summary
    runs-on: ubuntu-latest
    needs: [coverage-check, invariants-check, secrets-scan, critical-tests]
    if: always()

    steps:
      - name: 📋 Generate Summary
        run: |
          echo "## 🛡️ Quality Gate Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Gate | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Coverage Check | ${{ needs.coverage-check.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Invariants | ${{ needs.invariants-check.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Secrets Scan | ${{ needs.secrets-scan.result == 'success' && '✅ Passed' || '⚠️ Warning' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Critical Tests | ${{ needs.critical-tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
