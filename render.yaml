# ========================================
# PROST-QS - Render.com Configuration
# Backend Go com PostgreSQL (Supabase/Neon)
# ========================================

services:
  - type: web
    name: prost-qs-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: oregon
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GIN_MODE
        value: release
      - key: SERVER_PORT
        value: "8080"
      # PostgreSQL - Configurar no Dashboard do Render
      - key: DATABASE_URL
        sync: false  # Configurar manualmente no dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: AES_SECRET_KEY
        sync: false  # Configurar manualmente (32 bytes)
      - key: SECRETS_MASTER_KEY
        sync: false  # Configurar manualmente (32 bytes)
      # Lighthouse Config
      - key: LIGHTHOUSE_ID
        value: "lighthouse-kernel-01"
      - key: LIGHTHOUSE_REGION
        value: "sa-east"
