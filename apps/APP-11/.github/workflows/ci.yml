
name: Continuous Integration - Project Genesis

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/ci.yml'
      - 'tests/e2e/**'
      - 'docker/**'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/ci.yml'
      - 'tests/e2e/**'
      - 'docker/**'
  workflow_dispatch: # Allows manual trigger

jobs:
  build-backend:
    name: Build & Test Backend (Go)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: backend/go.sum

      - name: Go Modules Download
        working-directory: ./backend
        run: go mod download

      - name: Run Backend Tests
        working-directory: ./backend
        run: go test ./... -v -race -coverprofile=coverage.out

      - name: Lint Backend Code
        working-directory: ./backend
        # Install golangci-lint if not present
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.59.1
          golangci-lint run ./...

      - name: Build Backend Binary
        working-directory: ./backend
        run: go build -o main ./cmd/api/main.go

  build-frontend:
    name: Build & Test Frontend (Next.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint Frontend Code
        working-directory: ./frontend
        run: npm run lint

      # - name: Run Frontend Unit/Component Tests (if any)
      #   working-directory: ./frontend
      #   run: npm test

      - name: Build Frontend Application
        working-directory: ./frontend
        run: npm run build

  e2e-tests:
    name: Run End-to-End Tests
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend] # Ensure backend and frontend builds are successful
    env:
      DATABASE_NAME: test_db
      DATABASE_USER: test_user
      DATABASE_PASSWORD: test_password
      JWT_SECRET_KEY: testsecretkeyfore2e_long_enough_32bytes_or_more
      JWT_REFRESH_SECRET_KEY: testrefreshsecretkeyfore2e_long_enough_32bytes_or_more
      REFRESH_TOKEN_ENCRYPTION_KEY: R2VzdCwgcmVmcmVzaCB0b2tlbnMga2V5IA== # Base64 encoded 32-byte key
      FRONTEND_URL: http://localhost:3000
      FRONTEND_BACKEND_API_URL: http://localhost:8080/api/v1 # This is the internal URL for frontend to talk to backend in docker-compose for E2E
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Bring up Docker Compose for E2E tests
        run: docker-compose -f docker-compose.yml up --build -d
        # Use -f docker-compose.ci.yml if a dedicated CI compose file is created

      - name: Wait for services to be healthy
        timeout-minutes: 5
        run: docker-compose -f docker-compose.yml ps && docker-compose -f docker-compose.yml logs && docker-compose -f docker-compose.yml ps -q | xargs docker inspect --format='{{.State.Health.Status}}'
        # The above is a simplification. A more robust way is to use wait-for-it.sh or specific healthcheck wait commands.
        # For CI, we'll rely on service_healthy in compose and then a sleep to be safe.
        # More robust: Loop with `docker-compose exec <service> pg_isready` and `curl` for backend/frontend
      - name: Give services an extra moment to stabilize
        run: sleep 15 # Adjust as needed

      - name: Run Playwright Tests
        run: npx playwright test tests/e2e/ --project=chromium --reporter=github
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000 # Playwright directly hits the frontend
          # Pass env vars needed for Playwright config

      - name: Upload Playwright Test Report (if failed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 5

      - name: Bring down Docker Compose
        if: always() # Ensure this runs even if tests fail
        run: docker-compose -f docker-compose.yml down --volumes
