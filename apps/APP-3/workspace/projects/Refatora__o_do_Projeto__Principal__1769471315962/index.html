<html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TITAN LOGISTICS | Command Center</title>
    
    <!-- FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&amp;family=Orbitron:wght@400;500;700;900&amp;display=swap" rel="stylesheet">
    
    <!-- LIBRARIES (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- CONFIGURAÇÃO TAILWIND -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        titan: {
                            bg: '#0A192F',
                            surface: '#112240',
                            light: '#233554',
                            cyan: '#64FFDA',
                            slate: '#8892b0',
                            white: '#e6f1ff',
                            gold: '#FFD700',
                            danger: '#FF4D4D'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Orbitron', 'monospace'],
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'scanline': 'scanline 8s linear infinite',
                        'float': 'float 6s ease-in-out infinite',
                    },
                    keyframes: {
                        scanline: {
                            '0%': { transform: 'translateY(-100%)' },
                            '100%': { transform: 'translateY(100%)' }
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* CSS CUSTOMIZADO PARA MAPA E EFEITOS */
        body { background-color: #0A192F; color: #e6f1ff; overflow: hidden; }
        
        /* Glassmorphism */
        .glass-panel {
            background: rgba(17, 34, 64, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(100, 255, 218, 0.1);
        }

        .glass-panel:hover {
            border-color: rgba(100, 255, 218, 0.3);
            box-shadow: 0 0 15px rgba(100, 255, 218, 0.1);
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0A192F; }
        ::-webkit-scrollbar-thumb { background: #233554; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #64FFDA; }

        /* Map Tiles Filter (Dark Mode) */
        .leaflet-layer, .leaflet-control-zoom-in, .leaflet-control-zoom-out, .leaflet-control-attribution { 
            filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%); 
        }
        
        /* Custom Markers */
        .marker-icon {
            transition: all 0.5s ease;
        }
        
        /* Loading Screen */
        #loader {
            position: fixed; inset: 0; z-index: 9999;
            background: #0A192F;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        
        .loader-bar {
            width: 200px; height: 2px; background: #233554; margin-top: 20px; position: relative; overflow: hidden;
        }
        .loader-bar::after {
            content: ''; position: absolute; left: -50%; width: 50%; height: 100%;
            background: #64FFDA; animation: load 2s infinite linear;
        }
        @keyframes load { 0% { left: -50%; } 100% { left: 150%; } }

        /* Input Styles */
        .titan-input {
            background: rgba(10, 25, 47, 0.8);
            border: 1px solid #233554;
            color: #64FFDA;
            font-family: 'Orbitron', monospace;
            transition: all 0.3s;
        }
        .titan-input:focus {
            outline: none; border-color: #64FFDA; box-shadow: 0 0 10px rgba(100,255,218,0.2);
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col font-sans selection:bg-titan-cyan selection:text-titan-bg">

    <!-- === LOADER / AUTH SCREEN === -->
    <div id="auth-screen" class="fixed inset-0 z-50 bg-titan-bg flex items-center justify-center">
        <div class="glass-panel p-8 rounded-none border-l-4 border-titan-cyan w-full max-w-md relative overflow-hidden group">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-titan-cyan to-transparent opacity-50"></div>
            
            <div class="text-center mb-8">
                <h1 class="font-mono text-4xl font-bold tracking-widest text-titan-cyan mb-2">TITAN<span class="text-white text-sm block tracking-[0.5em] mt-1">LOGISTICS</span></h1>
                <p class="text-titan-slate text-xs uppercase tracking-widest mt-4">Restricted Access // Level 5 Clearance</p>
            </div>

            <form id="login-form" class="space-y-6">
                <div>
                    <label class="block text-xs font-mono text-titan-cyan mb-2">IDENTIFIER</label>
                    <input type="email" id="email" value="command@titan.lux" class="titan-input w-full p-3 rounded-none text-sm" placeholder="ID">
                </div>
                <div>
                    <label class="block text-xs font-mono text-titan-cyan mb-2">SECURITY KEY</label>
                    <input type="password" id="password" value="titan-elite-2024" class="titan-input w-full p-3 rounded-none text-sm" placeholder="******">
                </div>
                <button type="submit" class="w-full bg-titan-cyan/10 hover:bg-titan-cyan/20 text-titan-cyan border border-titan-cyan/50 font-mono py-3 uppercase tracking-widest transition-all hover:shadow-[0_0_20px_rgba(100,255,218,0.3)]">
                    Initialize System
                </button>
            </form>
            <div id="login-error" class="hidden mt-4 text-titan-danger text-xs text-center font-mono blink">ACCESS DENIED</div>
        </div>
    </div>

    <!-- === MAIN INTERFACE === -->
    <div id="app-interface" class="flex-1 flex hidden opacity-0 transition-opacity duration-1000">
        
        <!-- SIDEBAR -->
        <aside class="w-80 bg-titan-bg/95 flex flex-col border-r border-titan-light z-20 relative shadow-2xl">
            <!-- Header -->
            <div class="p-6 border-b border-titan-light">
                <div class="flex items-center gap-3">
                    <i class="fa-solid fa-plane-up text-titan-cyan text-xl"></i>
                    <div>
                        <h2 class="font-mono text-lg font-bold text-white leading-none">TITAN</h2>
                        <span class="text-[10px] text-titan-slate tracking-[0.2em] uppercase">Global Fleet</span>
                    </div>
                </div>
                <div class="mt-4 flex items-center gap-2">
                    <div class="w-2 h-2 rounded-full bg-titan-cyan animate-pulse"></div>
                    <span class="text-xs text-titan-cyan font-mono" id="connection-status">SYSTEM ONLINE</span>
                </div>
            </div>

            <!-- Fleet List -->
            <div class="flex-1 overflow-y-auto p-4 space-y-3" id="fleet-list">
                <!-- Assets injected here via JS -->
                <div class="text-center text-titan-slate text-sm mt-10">Scanning Satellite Uplink...</div>
            </div>

            <!-- User Footer -->
            <div class="p-4 border-t border-titan-light bg-titan-surface/50">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 bg-titan-cyan/20 rounded-none flex items-center justify-center border border-titan-cyan">
                        <i class="fa-solid fa-user-astronaut text-titan-cyan text-xs"></i>
                    </div>
                    <div>
                        <div class="text-xs text-white font-mono">COMMANDER</div>
                        <div class="text-[10px] text-titan-slate">ID: 99-XA-ALPHA</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- MAP AREA -->
        <main class="flex-1 relative bg-black">
            <div id="map" class="w-full h-full z-10"></div>
            
            <!-- Overlay: Asset Details / Booking -->
            <div id="asset-panel" class="absolute top-6 right-6 w-96 glass-panel transform translate-x-[120%] transition-transform duration-500 z-30 p-0 flex flex-col max-h-[90vh]">
                <!-- Panel content injected via JS -->
            </div>

            <!-- Overlay: HUD Elements -->
            <div class="absolute bottom-6 left-6 z-20 pointer-events-none">
                <div class="flex gap-4">
                    <div class="glass-panel px-4 py-2 pointer-events-auto">
                        <span class="text-xs text-titan-slate font-mono block">LATITUDE</span>
                        <span class="text-titan-cyan font-mono" id="hud-lat">00.0000</span>
                    </div>
                    <div class="glass-panel px-4 py-2 pointer-events-auto">
                        <span class="text-xs text-titan-slate font-mono block">LONGITUDE</span>
                        <span class="text-titan-cyan font-mono" id="hud-lng">00.0000</span>
                    </div>
                    <div class="glass-panel px-4 py-2 pointer-events-auto">
                        <span class="text-xs text-titan-slate font-mono block">UTC TIME</span>
                        <span class="text-white font-mono" id="hud-time">00:00:00</span>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- TOAST NOTIFICATIONS -->
    <div id="toast-container" class="fixed top-6 left-1/2 transform -translate-x-1/2 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <script>
        //

<script type="text/plain" data-path="docs/architecture.json">

</body></html>
