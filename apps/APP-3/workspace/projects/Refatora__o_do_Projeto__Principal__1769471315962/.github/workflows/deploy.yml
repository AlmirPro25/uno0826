
name: Titan Deployment Protocol (CD)

on:
  release:
    types: [published]

jobs:
  deploy_production:
    name: Deploy to Command Server
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3

      - name: Login to Docker Registry
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build & Push Images
        run: |
          docker build -t titan-backend:latest -f docker/Dockerfile.backend ./backend
          docker build -t titan-frontend:latest -f docker/Dockerfile.frontend ./frontend
          docker push titan-backend:latest
          docker push titan-frontend:latest

      - name: Remote Activation (SSH)
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            echo "
