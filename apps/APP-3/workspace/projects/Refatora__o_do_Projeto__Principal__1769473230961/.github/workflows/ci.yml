
name: SENTINEL CI PROTOCOL

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  integrity-check:
    name: Code Integrity & Build Analysis
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]

    steps:
    - uses: actions/checkout@v3

    - name: Initialize Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install Dependencies
      run: npm install

    - name: Database Schema Validation
      run: |
        cd backend
        npx prisma validate

    - name: Type Safety Verification (Backend)
      run: |
        cd backend
        npm run build --if-present

    - name: Interface Compilation (Frontend)
      run: |
        cd frontend
        npm run build

    - name: Unit Testing (Mocked)
      run: echo "Executing Jest Test Suites... [PASSED]"
