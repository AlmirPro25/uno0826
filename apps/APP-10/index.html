    <title>Aether | Magical HTML Box</title>
    <!-- CRITICAL: COI Service Worker for WebContainer support in non-isolated environments -->
    <!-- Must be loaded locally to allow Service Worker registration (Same-Origin Policy) -->
    <script src="coi-serviceworker.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- XTerm CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
    
    <style>
      :root {
        --bg-dark: #09090b;
        --bg-panel: #0c0c0e;
        --border-color: #27272a;
        --accent: #6366f1;
      }
      
      html, body {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden; /* Critical for app-like feel */
        background-color: var(--bg-dark);
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        color: #e2e8f0;
        -webkit-font-smoothing: antialiased;
      }
      
      #root {
        height: 100%;
        width: 100%;
        display: flex;
        flex-direction: column;
      }
      
      /* Slim, Dark Scrollbar */
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background-color: transparent;
        border: 3px solid transparent;
        background-clip: content-box;
        border-radius: 99px;
      }
      :hover::-webkit-scrollbar-thumb {
        background-color: #3f3f46; 
      }
      ::-webkit-scrollbar-corner {
        background: transparent;
      }

      /* Utility Classes */
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background-color: #27272a;
      }
      .custom-scrollbar:hover::-webkit-scrollbar-thumb {
        background-color: #3f3f46;
      }

      /* Resizer Styles */
      .resizer-vertical {
        width: 1px;
        background: transparent;
        cursor: col-resize;
        z-index: 50;
        flex-shrink: 0;
        height: 100%;
        position: relative;
        transition: background 0.2s;
      }
      .resizer-vertical::before {
        content: '';
        position: absolute;
        left: -4px;
        right: -4px;
        top: 0;
        bottom: 0;
        z-index: 10;
      }
      .resizer-vertical:hover, .resizer-vertical.resizing {
        background: var(--accent); 
      }
      
      .resizer-horizontal {
        height: 1px;
        background: #27272a;
        cursor: row-resize;
        z-index: 50;
        width: 100%;
        position: relative;
        transition: background 0.2s;
      }
      .resizer-horizontal::before {
        content: '';
        position: absolute;
        top: -4px;
        bottom: -4px;
        left: 0;
        right: 0;
        z-index: 10;
      }
      .resizer-horizontal:hover {
        background: var(--accent);
      }

      .select-none {
        user-select: none;
        -webkit-user-select: none;
      }
      
      /* Markdown Styles */
      .markdown-content p { margin-bottom: 0.5em; }
      .markdown-content p:last-child { margin-bottom: 0; }
      .markdown-content code { 
        background: rgba(255,255,255,0.1); 
        padding: 0.2em 0.4em; 
        border-radius: 4px; 
        font-family: 'JetBrains Mono', monospace; 
        font-size: 0.9em;
      }
      .markdown-content pre { 
        background: #1e1e1e; 
        padding: 0.8em; 
        border-radius: 8px; 
        overflow-x: auto; 
        margin: 0.5em 0;
      }
      .markdown-content pre code { 
        background: transparent; 
        padding: 0; 
        color: #e2e8f0;
      }
      .markdown-content ul { list-style-type: disc; padding-left: 1.2em; margin: 0.5em 0; }
      .markdown-content ol { list-style-type: decimal; padding-left: 1.2em; margin: 0.5em 0; }
      .markdown-content strong { color: #fff; font-weight: 600; }
    </style>
