
version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: ghost_brain
    volumes:
      - ./backend/src:/app/src
      - ./shared:/app/../shared
      - ./data:/app/data
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=file:/app/data/ghost.db
      - NODE_ENV=development
      - PORT=3000
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: ghost_ui
    ports:
      - "8080:80"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:3000/api/v1
    restart: always

volumes:
  ghost_data:
